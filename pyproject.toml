[build-system]
requires = ["uv_build>=0.12.16,<0.13"]
build-backend = "uv_build"

[project]
name = "ai-engineer-roadmap"
version = "0.1.0"
description = "Reproducible exercises for an AI engineering learning roadmap."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "numpy",
    "pandas",
    "scikit-learn",
    "langgraph",
    "langsmith",
    "mcp",
    "uvicorn[standard]",
]

[dependency-groups]
visualization = [
    "matplotlib==3.11.2",
]
training = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "datasets==5.0.1",
]
tracking = [
    "mlflow>=3.0,<4",
]
retrieval = [
    "qdrant-client>=1.15,<2",
]
finetuning = [
    {include-group = "training"},
    "peft>=0.17,<1",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx2",
    "ruff",
    "mypy",
    "jupyterlab",
    "ipykernel",
    "nbformat",
    "pandas-stubs",
]

[tool.uv.build-backend]
module-name = "roadmap_tools"

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests", "modules", "projects", "labs"]
xfail_strict = true
markers = [
    "student_exercise: marks a student starter exercise as expected incomplete",
    "postgres: marks tests that require PostgreSQL",
    "optional_live: explicit live experiment; not run by default",
    "optional_gpu: optional device experiment; not required for CPU credit",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"src/roadmap_tools/exercise.py" = ["UP047"]
"tests/tooling/test_exercise.py" = ["E731"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
    "src",
    "projects/banking_ai_lab",
    "modules/02_python_backend/examples",
]
packages = [
    "roadmap_tools",
    "modules.01_python_core",
    "modules.02_python_backend",
    "modules.03_data_foundations",
    "modules.04_machine_learning",
    "modules.05_llm_engineering",
    "modules.06_rag",
    "modules.07_agents",
    "modules.08_production_ai",
    "banking_ai_lab",
    "support_api",
    "projects.banking_ai_lab.tests",
    "projects.document_intelligence_lab",
    "scripts",
    "tests",
]
exclude = [
    "(^|/).*\\.ipynb$",
    "(^|/)review_fixtures/",
    "(^|/)review_me\\.py$",
    "(^|/)debugging/.*/broken\\.py$",
]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Plotting/training/PEFT are opt-in; installed packages still supply their own types.
module = ["matplotlib.*", "torch.*", "peft.*"]
ignore_missing_imports = true
