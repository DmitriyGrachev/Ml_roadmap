services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${BANKING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BANKING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BANKING_POSTGRES_DB}
    ports:
      - "127.0.0.1:${BANKING_POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build:
      context: ../..
      dockerfile: projects/banking_ai_lab/Dockerfile
    environment:
      BANKING_DATABASE_URL: postgresql+psycopg://${BANKING_POSTGRES_USER}:${BANKING_POSTGRES_PASSWORD}@postgres:5432/${BANKING_POSTGRES_DB}
      BANKING_LOG_LEVEL: ${BANKING_LOG_LEVEL}
      BANKING_API_PREFIX: ${BANKING_API_PREFIX}
    ports:
      - "127.0.0.1:${BANKING_APP_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
